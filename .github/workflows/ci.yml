name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch has Vulkan headers new enough for VK_EXT_present_timing, and SDL3.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git python sdl3 vulkan-headers vulkan-icd-loader
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Werror"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python3 -m lagtrace --help && python3 -m lagtrace doctor || true
      - name: Staged install
        run: make install DESTDIR="$PWD/stage" PREFIX=/usr && find stage -type f | sort
